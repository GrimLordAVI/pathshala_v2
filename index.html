<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathshala</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen">

<div class="container mx-auto px-4 py-8 md:px-8 lg:px-16">

    <div class="topbar flex flex-col md:flex-row justify-between items-center mb-8">
        <h2 class="logo text-2xl md:text-3xl font-bold mb-4 md:mb-0">PATHSHALA</h2>
        <a href="admin.html" class="btn-outline border border-gray-600 px-4 py-2 rounded-lg hover:bg-gray-800 transition">ADD STUDENT</a>
    </div>

    <div class="hero flex flex-col md:flex-row items-center justify-between min-h-[60vh] md:min-h-[80vh]">
        <div class="left text-center md:text-left mb-8 md:mb-0">
            <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold mb-4">Student<br>Attendance</h1>
            <p class="text-gray-400 text-lg mb-6">Mark student attendance seamlessly</p>

            <div class="buttons flex flex-col sm:flex-row gap-4">
                <a href="teacher.html" class="btn-primary bg-green-600 hover:bg-green-700 px-6 py-3 rounded-lg text-white font-semibold transition">MARK ATTENDANCE</a>
                <a href="#" class="btn-secondary bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-lg text-white font-semibold transition">VIEW DASHBOARD</a>
            </div>
        </div>

        <div class="right hidden md:block absolute md:static right-4 md:right-0 top-1/2 md:top-auto transform -translate-y-1/2 md:transform-none pointer-events-none">
            <h1 class="bg-text text-6xl md:text-8xl lg:text-9xl font-bold text-white opacity-10 rotate-[-12deg] skew-y-2">ATTENDANCE</h1>
            <h1 class="bg-text text-6xl md:text-8xl lg:text-9xl font-bold text-white opacity-15 rotate-[-4deg] skew-y-1">ATTENDANCE</h1>
            <h1 class="bg-text text-6xl md:text-8xl lg:text-9xl font-bold text-white opacity-5 rotate-6 skew-y-[-1.5]">ATTENDANCE</h1>
        </div>
    </div>

</div>

</body>
</html>
