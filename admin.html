<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-4">

<div class="max-w-4xl mx-auto">

<h1 class="text-2xl md:text-4xl lg:text-5xl font-bold mb-8 text-center md:text-left">
Admin Panel
</h1>

<!-- Add Student Card -->
<div class="bg-gray-900 p-6 rounded-xl mb-6 shadow-lg">

<h2 class="text-xl md:text-2xl font-semibold mb-4">
Add Student
</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

<input 
id="name"
type="text"
placeholder="Student Name"
class="bg-black border border-gray-700 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-green-500"
/>

<input 
id="roll"
type="text"
placeholder="Roll Number"
class="bg-black border border-gray-700 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-green-500"
/>

<input 
id="class"
type="text"
placeholder="Class (PCMC)"
class="bg-black border border-gray-700 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-green-500"
/>

</div>

<div class="mt-4 text-center md:text-left">
<button 
onclick="addStudent()"
class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded-lg font-semibold transition w-full md:w-auto">
Add Student
</button>
</div>

</div>


<!-- Delete Student Card -->
<div class="bg-gray-900 p-6 rounded-xl shadow-lg">

<h2 class="text-xl md:text-2xl font-semibold mb-4">
Delete Student
</h2>

<div class="flex flex-col md:flex-row gap-4">

<input 
id="deleteRoll"
type="text"
placeholder="Roll Number"
class="bg-black border border-gray-700 p-3 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-red-500"
/>

<div class="text-center md:text-left">
<button 
onclick="deleteStudent()"
class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-lg font-semibold transition w-full md:w-auto">
Delete
</button>
</div>

</div>

</div>

</div>
<script src="config.js"></script>
<script src="scripts.js"></script>
</body>
</html>
