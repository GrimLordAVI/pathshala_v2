<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen p-4">

<div class="max-w-6xl mx-auto">

<h1 class="text-2xl md:text-4xl lg:text-5xl font-bold mb-6 text-center md:text-left">
Teacher Attendance
</h1>

<div class="flex flex-col md:flex-row gap-4 mb-6">

<select id="classSelect" class="bg-gray-900 border border-gray-700 p-3 rounded-lg w-full md:w-auto flex-1">
<option value="">Select Class</option>
<option value="PCMC">PCMC</option>
<option value="PCMB">PCMB</option>
<option value="CEBA">CEBA</option>
<option value="SEBA">SEBA</option>
</select>

<button onclick="loadStudents()"
class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded-lg transition w-full md:w-auto">
Load Students
</button>

</div>

<div class="bg-gray-900 bg-opacity-50 rounded-xl p-4 md:p-6 overflow-x-auto">

<table class="w-full border-collapse min-w-[600px]">

<thead>
<tr class="border-b border-gray-700 text-left">
<th class="p-3 md:p-4 font-semibold">Name</th>
<th class="p-3 md:p-4 font-semibold">Roll</th>
<th class="p-3 md:p-4 font-semibold">Present</th>
<th class="p-3 md:p-4 font-semibold">Absent</th>
</tr>
</thead>

<tbody id="studentTable"></tbody>

</table>

</div>

<div class="mt-6 text-center">
<button onclick="submitAttendance()"
class="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-lg text-lg font-semibold transition w-full md:w-auto">
Submit Attendance
</button>
</div>

</div>
<script src="../config.js"></script>
<script src="scripts.js"></script>

</body>
</html>
